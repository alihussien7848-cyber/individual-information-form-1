<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>استمارة معلومات الأفراد</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .organization-header {
      text-align: center;
      padding: 20px 10px;
      margin-bottom: 20px;
    }
    .organization-logo img {
      width: 200px;
      height: 200px;
      object-fit: contain;
      display: block;
      margin: 0 auto 15px;
    }
    .organization-header h2 {
      font-size: 22px;
      font-weight: bold;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <header class="organization-header">
    <div class="organization-logo">
      <img src="/logo.png" alt="شعار الجهة">
    </div>
    <h2>المقاومة الإسلامية - حركة عصائب أهل الحق</h2>
  </header>

  <main class="wrap">
    <div class="notice">
      <b>الخصوصية:</b>
      تُستخدم المعلومات للغرض الإداري المحدد من الجهة المسؤولة.
      لا ترسل الاستمارة إلا بعد الموافقة.
    </div>

    <form id="form" class="panel">
      <div class="fields">

        <label>الاسم الرباعي واللقب *
          <input name="full_name" required minlength="5">
        </label>

        <label>المواليد *
          <input name="birth_date" type="date" required>
        </label>

        <label>تاريخ الانتماء *
          <input name="affiliation_date" type="date" required>
        </label>

        <label>الحالة الاجتماعية *
          <select name="marital_status" required>
            <option value="">اختر</option>
            <option>أعزب</option>
            <option>متزوج</option>
            <option>مطلق</option>
            <option>أرمل</option>
          </select>
        </label>

        <label>اسم الأم *
          <input name="mother_name" required>
        </label>

        <label>رقم الناخب
          <input name="voter_number">
        </label>

        <label>المحافظة *
          <input name="province" required>
        </label>

        <label>القضاء *
          <input name="district" required>
        </label>

        <label>الناحية
          <input name="subdistrict">
        </label>

        <label>محلة
          <input name="mahalla">
        </label>

        <label>زقاق
          <input name="street">
        </label>

        <label>دار
          <input name="house_number">
        </label>

        <label>التحصيل الدراسي *
          <select name="education" required>
            <option value="">اختر</option>
            <option>أمي</option>
            <option>يقرأ ويكتب</option>
            <option>ابتدائية</option>
            <option>متوسطة</option>
            <option>إعدادية</option>
            <option>دبلوم</option>
            <option>بكالوريوس</option>
            <option>دبلوم عالٍ</option>
            <option>ماجستير</option>
            <option>دكتوراه</option>
          </select>
        </label>

        <label>رقم الهاتف *
          <input name="phone" type="tel" required minlength="7">
        </label>

        <label>موظف؟ *
          <select name="is_employee" id="employee" required>
            <option value="">اختر</option>
            <option value="yes">نعم</option>
            <option value="no">لا</option>
          </select>
        </label>

        <label id="workWrap" class="hidden">
          مكان الوظيفة *
          <input name="workplace" id="workplace">
        </label>

        <label>المهنة
          <input name="profession">
        </label>

        <label>اسم المعرف أو المزكي
          <input name="recommender">
        </label>

        <label>رابط Facebook
          <input name="facebook_url" type="url" placeholder="https://facebook.com/...">
        </label>

        <label>رابط Instagram
          <input name="instagram_url" type="url" placeholder="https://instagram.com/...">
        </label>

        <label>رابط TikTok
          <input name="tiktok_url" type="url" placeholder="https://tiktok.com/@...">
        </label>

        <label>رابط Twitter / X
          <input name="twitter_url" type="url" placeholder="https://x.com/...">
        </label>

      </div>

      <label class="consent">
        <input type="checkbox" name="consent" required>
        أوافق على جمع المعلومات للغرض الموضح أعلاه.
      </label>

      <button class="primary" type="submit">إرسال الاستمارة</button>
      <p id="msg" role="status"></p>
    </form>

    <p style="text-align:center">
      <a href="admin.html">دخول الإدارة</a>
    </p>
  </main>

  <script src="form.js"></script>
</body>
</html>
